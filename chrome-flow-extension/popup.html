<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Product Creator</title>
    <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <img src="assets/logo.svg" alt="Flow" width="20" height="20" />
        </div>
        <div class="header-text">
            <h1>Flow Product Creator</h1>
            <p>สร้างวิดีโอ + ดึงสินค้า TikTok</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button id="videoTabBtn" class="tab-button tab-button--active" type="button">
            <img class="icon" src="assets/icon-flow.svg" alt="Flow" />
            สร้างวิดีโอ
        </button>
        <button id="tiktokTabBtn" class="tab-button" type="button">
            <img class="icon" src="assets/icon-tiktok.svg" alt="TikTok" />
            สินค้า TikTok
        </button>
    </div>

    <!-- Video Tab -->
    <div id="videoTab" class="panel panel--active">
        <section class="section">
            <div class="section__content">
                <div class="section-header">
                    <div>
                        <h2>ตั้งค่าวิดีโอ</h2>
                        <p class="section-note">สร้างวิดีโอและภาพสินค้าด้วย Google Flow</p>
                    </div>
                </div>

                <!-- Selected Product Fields -->
                <div class="field" style="display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;">
                    <img id="product-image-preview" src="assets/icon-128.png" style="width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2);" alt="Preview">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                        <div>
                            <label class="field-label" for="product-name-input" style="margin-bottom: 4px;">ชื่อสินค้า</label>
                            <input type="text" id="product-name-input" class="input" placeholder="สามารถแก้ไขชื่อสินค้าได้ที่นี่">
                        </div>
                        <div>
                            <label class="field-label" for="product-image-input" style="margin-bottom: 4px;">ลิงก์รูปภาพ</label>
                            <input type="text" id="product-image-input" class="input" placeholder="วาง URL ของรูปภาพ">
                        </div>
                    </div>
                </div>

                <!-- Image Generation Settings -->
                <h3 style="margin-top: 16px; margin-bottom: 8px; font-size: 13px; color: var(--primary); font-weight: 600;">1. ตั้งค่าสร้างภาพใหม่ (Image Settings)</h3>
                <div class="field">
                    <label class="field-label" for="image-style">สไตล์ภาพ (Image Style)</label>
                    <select id="image-style" class="select">
                        <option value="cinematic">Cinematic (สมจริง)</option>
                        <option value="studio">Studio Lighting (จัดแสงสตูดิโอ)</option>
                        <option value="anime">Anime (การ์ตูน)</option>
                        <option value="3d">3D Render (ภาพสามมิติ)</option>
                        <option value="popart">Pop Art (สีสันสดใส)</option>
                    </select>
                </div>
                
                <div class="field">
                    <label class="field-label" for="image-prompt-extra">รายละเอียดภาพ (Image Prompt)</label>
                    <textarea id="image-prompt-extra" class="input" rows="2" placeholder="เช่น: สินค้าวางบนโขดหิน, ฉากหลังป่าไม้ชุ่มชื้น..." style="resize: vertical;"></textarea>
                </div>

                <!-- Video Generation Settings -->
                <h3 style="margin-top: 20px; margin-bottom: 8px; font-size: 13px; color: var(--accent); font-weight: 600;">2. ตั้งค่านำภาพไปทำวิดีโอ (Video Settings)</h3>
                <div class="field">
                    <label class="field-label" for="video-motion">มุมกล้อง (Camera Motion)</label>
                    <select id="video-motion" class="select">
                        <option value="auto">Auto (ให้ AI เลือก)</option>
                        <option value="zoom-in">Zoom In (ซูมเข้า)</option>
                        <option value="zoom-out">Zoom Out (ซูมออก)</option>
                        <option value="pan-left">Pan Left (แพนซ้าย)</option>
                        <option value="pan-right">Pan Right (แพนขวา)</option>
                    </select>
                </div>

                <div class="field">
                    <label class="field-label" for="video-prompt-extra">รายละเอียดวิดีโอ (Video Prompt)</label>
                    <textarea id="video-prompt-extra" class="input" rows="2" placeholder="เช่น: น้ำหยดลงพื้น, มีควันจางๆ พัดผ่าน..." style="resize: vertical;"></textarea>
                </div>

                <div class="field" style="margin-top: 20px;">
                    <button id="generate-video-btn" class="button button--primary" type="button">
                        <img class="button__icon" src="assets/icon-flow.svg" alt="Generate" />
                        เริ่มสร้างภาพและวิดีโอบน Flow
                    </button>
                </div>

                <div class="field">
                    <button id="open-flow-btn" class="button button--ghost" type="button">
                        เปิดหน้า Google Flow
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- TikTok Tab -->
    <div id="tiktokTab" class="panel">
        <section class="section">
            <div class="section__content">
                <div class="section-header">
                    <div>
                        <h2>สินค้า TikTok Showcase</h2>
                        <p class="section-note">เลือกสินค้า TikTok แล้วส่งไปยังหน้าสร้างวิดีโอได้ทันที</p>
                    </div>
                    <button id="connect-tiktok" class="button button--ghost" type="button">เชื่อมต่อ</button>
                </div>

                <div class="product-toolbar">
                    <input id="product-search" class="input" type="search" placeholder="🔍  ค้นหาสินค้า" />
                    <select id="product-sort" class="select" aria-label="เรียงสินค้า">
                        <option value="newest" selected>ล่าสุด</option>
                        <option value="name">ชื่อ</option>
                        <option value="commission">ค่าคอมฯ</option>
                        <option value="price">ราคา</option>
                        <option value="stock">สต็อก</option>
                    </select>
                    <button id="refresh-products" class="button" type="button">↻ Refresh</button>
                </div>

                <div class="field-inline">
                    <label>
                        <input id="select-all-products" type="checkbox" />
                        เลือกทั้งหมด
                    </label>
                    <button id="create-batch-videos" class="button button--primary" type="button" disabled>
                        สร้างวิดีโอ (0)
                    </button>
                </div>

                <div id="product-list" class="product-list"></div>
                <div id="pagination-controls" class="pagination-container"></div>

                <button id="load-more-products" class="button" type="button" hidden>
                    โหลดข้อมูลเพิ่ม (ชุดถัดไป)
                </button>

                <div id="status" class="status-bar status-bar--info">รอใช้งาน</div>
            </div>
        </section>
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
